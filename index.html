<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LinguaGuess, a language identification game. Read a short passage and guess its language, across Slavic, Romance and Nordic modes.">
  <title>LinguaGuess</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <!-- Left: home (hidden on menu & results views) -->
    <button id="home-btn" class="icon-btn" aria-label="Home" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9.5V21h5v-6h4v6h5V9.5"/>
      </svg>
    </button>

    <!-- Center: view title + live score -->
    <div class="topbar-center">
      <h1 id="view-title">LinguaGuess</h1>
      <span id="score-badge" class="score-badge" hidden>Score: 0</span>
      <span id="time-badge" class="time-badge" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
        <span id="time-text"></span>
      </span>
    </div>

    <!-- Right: UI language switcher (persisted) -->
    <div class="lang-switch" role="group" aria-label="Interface language">
      <button class="flag-btn" data-uilang="en" aria-label="English">🇬🇧</button>
      <button class="flag-btn" data-uilang="fr" aria-label="Français">🇫🇷</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="modal-root"></div>

  <!-- Classic scripts sharing the LG namespace: also works over file:// -->
  <script defer src="js/i18n.js"></script>
  <script defer src="js/guides.js"></script>
  <script defer src="js/classifier.js"></script>
  <script defer src="js/data/ru.js"></script>
  <script defer src="js/data/uk.js"></script>
  <script defer src="js/data/be.js"></script>
  <script defer src="js/data/bg.js"></script>
  <script defer src="js/data/fr.js"></script>
  <script defer src="js/data/es.js"></script>
  <script defer src="js/data/it.js"></script>
  <script defer src="js/data/pt.js"></script>
  <script defer src="js/data/sv.js"></script>
  <script defer src="js/data/da.js"></script>
  <script defer src="js/data/no.js"></script>
  <script defer src="js/data/is.js"></script>
  <script defer src="js/leaderboard.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
