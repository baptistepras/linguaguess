# Cloudflare Pages configuration.
# The static site is served from the repository root and everything under
# functions/ is deployed alongside it as an API, with no separate build step.

name = "linguaguess"
pages_build_output_dir = "."
compatibility_date = "2026-01-01"

# Binds the D1 database to env.DB inside functions/api/scores.js.
# Create it once with:  npx wrangler d1 create linguaguess
# then paste the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "linguaguess"
database_id = "paste-your-database-id-here"

# Preview deployments (any branch other than the production one) get no binding
# unless it is repeated here, and the game simply reports the board as
# unavailable. Uncomment to let a branch preview share the live board.
# [env.preview]
# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "linguaguess"
# database_id = "paste-your-database-id-here"
